apiVersion: v1
kind: Pod
metadata:
  name: agent-pod
spec:
  containers:
    - name: agent
      image: mini-agent
      ports:
        - containerPort: 3001

    - name: tailscale
      image: tailscale/tailscale:latest
      securityContext:
        capabilities:
          add:
            - NET_ADMIN
      env:
        - name: TS_AUTHKEY
          value: "YOUR_TAILSCALE_AUTH_KEY"
      command: ["tailscaled"]